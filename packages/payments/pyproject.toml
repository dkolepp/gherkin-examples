[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-payments"
version = "1.0.0"
description = "Payments domain and its BDD kit (payments team)"
readme = "README.md"
requires-python = ">=3.10"
# The application itself. Only checkout depends on other teams' apps.
dependencies = []

[project.optional-dependencies]
# The BDD kit (driver + steps). Pick the extra for your runner.
behave = ["shop-bdd-common[behave]>=1.0,<2"]
pytest = ["shop-bdd-common[pytest]>=1.0,<2"]
dev = ["shop-payments[behave,pytest]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "features/"
addopts = "--strict-markers"
markers = ["payments: tag from the feature files"]
