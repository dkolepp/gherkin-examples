# The journey's wiring (environment.py, steps/) is in features/; the journey
# itself is a shared, language-neutral spec in specs/journeys/ at the repo root.
# SpecsRunner (from shop-bdd-common) lets the two live in different folders.
[behave]
runner = shop_bdd_common.behave_runner:SpecsRunner
paths = features
        ../../specs/journeys
