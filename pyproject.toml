[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gherkin-examples"
version = "0.1.0"
description = "Learn Gherkin and BDD in Python with behave and pytest-bdd"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-bdd>=8", "behave>=1.2.6"]

# Two importable packages: the app (src/shop) and the shared test layer.
[tool.setuptools]
packages = ["shop", "bdd_support"]

[tool.setuptools.package-dir]
shop = "src/shop"
bdd_support = "bdd_support"

# --- pytest / pytest-bdd ------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-bdd looks for .feature files relative to this folder, so both runners
# read the exact same specs from features/.
bdd_features_base_dir = "features/"
# Gherkin tags become pytest markers: `pytest -m smoke`
markers = [
    "cart: shopping cart scenarios",
    "discounts: discount code scenarios",
    "receipt: receipt scenarios",
    "smoke: quick, most important checks",
]
addopts = "--strict-markers"

# --- behave -------------------------------------------------------------------
[tool.behave]
paths = ["features"]
